[project]
name = "predix"
version = "0.2.0"
description = "Churn prediction, upsell scoring and RFM segmentation on e-commerce event data."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["api", "pipeline"]
